[project]
name = "youyuan"
version = "0.1.0"
description = "绕过平台推荐机制的信息聚合器"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# pythonpath 让 tests/ 能直接 import bilibili / store 这些顶层模块 ——
# pytest 默认只把测试文件所在目录加进 sys.path，那样 import 不到项目根。
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
